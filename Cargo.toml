[package]
name = "forever-fishing"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows audio-driven fishing assistant"
repository = "https://github.com/Mancuerna/forever-fishing"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
rand = "0.9"
wasapi = "0.27"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
lewton = "0.10"
rustfft = "6.4"
